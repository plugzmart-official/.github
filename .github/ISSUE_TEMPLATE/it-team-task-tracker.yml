name: IT Team - Task Tracker
description: Create and track IT team activities

body:


  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: Describe the requirement...
    validations:
      required: false

  - type: input
    id: start_date
    attributes:
      label: Start Date
      placeholder: YYYY-MM-DD
    validations:
      required: false

  - type: input
    id: end_date
    attributes:
      label: End Date
      placeholder: YYYY-MM-DD
    validations:
      required: false

  - type: textarea
    id: hold_details
    attributes:
      label: Hold Details
      value: |
        Hold Start Date:
        Hold End Date:
        Reason:

  - type: input
    id: total_holding_days
    attributes:
      label: Total Holding Days
      value: "0"



  - type: textarea
    id: remarks
    attributes:
      label: Remarks
      placeholder: Enter additional remarks...
