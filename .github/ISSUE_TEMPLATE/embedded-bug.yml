name: "Embedded - Bug Report"
description: "Report something that is broken or behaving unexpectedly."
title: "[Embedded][Bug]: "
labels: ["bug"]
projects: ["plugzmart-official/11"]
body:
  - type: markdown
    attributes:
      value: "Thanks for filing this with the **Embedded Team**. This issue is added to the team project automatically."
  - type: textarea
    id: summary
    attributes:
      label: "What happened?"
      description: "Clear description of the problem."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
      description: "What should have happened?"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual behavior"
      description: "What happened instead?"
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: "Severity"
      description: "How badly does this affect work?"
      options:
        - "Critical - blocks work / safety risk"
        - "High - major impact"
        - "Medium - workaround exists"
        - "Low - minor / cosmetic"
    validations:
      required: true
  - type: input
    id: firmware_version
    attributes:
      label: "Firmware version"
      description: "Version, tag, or commit hash."
      placeholder: "e.g. v1.4.2 / a1b2c3d"
    validations:
      required: true
  - type: input
    id: board_revision
    attributes:
      label: "Microcontroller / board revision"
      description: "MCU part number and board revision."
      placeholder: "e.g. STM32F407, Rev C"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Logs / serial output"
      description: "Paste serial console output, crash dumps, or debugger traces."
      render: "shell"
    validations:
      required: false
  - type: textarea
    id: attachments
    attributes:
      label: "Screenshots / attachments"
      description: "Drag and drop images, files, or extra context here."
    validations:
      required: false
