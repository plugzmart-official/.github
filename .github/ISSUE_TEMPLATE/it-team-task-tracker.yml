name: IT Team - Task Tracker
description: Create and track IT team activities

body:
  - type: dropdown
    id: work_type
    attributes:
      label: Work Type
      description: Select the type of work.
      options:
        - Task
        - Bug
        - Feature
        - Backlog
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: Describe the requirement...
    validations:
      required: false

  - type: input
    id: start_date
    attributes:
      label: Start Date
      placeholder: YYYY-MM-DD
    validations:
      required: false

  - type: input
    id: end_date
    attributes:
      label: End Date
      placeholder: YYYY-MM-DD
    validations:
      required: false

  - type: textarea
    id: hold_details
    attributes:
      label: Hold Details
      value: |
        Hold Start Date:
        Hold End Date:
        Reason:

  - type: input
    id: total_holding_days
    attributes:
      label: Total Holding Days
      value: "0"

  - type: dropdown
    id: project_name
    attributes:
      label: Project Name
      description: Select the associated project.
      options:
        - CMS
        - RMS
        - EMS-ISRO
        - OCPI
        - FIRMWARE APP
        - EMS-CLOUD
    validations:
      required: true

  - type: textarea
    id: remarks
    attributes:
      label: Remarks
      placeholder: Enter additional remarks...
